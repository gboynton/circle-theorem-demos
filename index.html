# index.html

```html
<!DOCTYPE html>
  <html lang="en">
    <head>
    <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interactive Circle Theorem Demos</title>

        <style>
        body {
          margin: 0;
          font-family: Arial, Helvetica, sans-serif;
          background: #f4f6fa;
            color: #222;
        }

      header {
        background: linear-gradient(#0d4f9a, #07336e);
          color: white;
          padding: 18px;
          text-align: center;
          font-size: 30px;
          font-weight: bold;
      }

      .container {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: calc(100vh - 72px);
      }

      .sidebar {
        background: white;
        border-right: 1px solid #bbb;
        padding: 18px;
        overflow-y: auto;
      }

      .sidebar h2 {
        margin-top: 0;
        color: #0b3d91;
          font-size: 22px;
      }

      .demoButton {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 12px;
        border: none;
        border-radius: 8px;
        background: #eef6ff;
          color: #0b3d91;
          font-size: 18px;
        font-weight: bold;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s;
      }

      .demoButton:hover {
        background: #dbeaff;
      }

      .viewer {
        background: #ddd;
          height: 100%;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
      }

      @media (max-width: 850px) {
        .container {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid #bbb;
        }
      }
      </style>
        </head>
        <body>

        <header>
        Interactive Circle Theorem Demos
      </header>

        <div class="container">

        <div class="sidebar">
        <h2>Choose a Demo</h2>

        <button class="demoButton" onclick="showDemo('circle_theorem_same_segment_demo.html')">
        Angles in the Same Segment
      </button>

        <button class="demoButton" onclick="showDemo('circle_theorem_center_angle_demo.html')">
        Angle at the Center
      </button>

        <button class="demoButton" onclick="showDemo('circle_theorem_semicircle_angle_demo.html')">
        Angle in a Semicircle
      </button>

        <button class="demoButton" onclick="showDemo('circle_theorem_cyclic_quadrilateral_demo.html')">
        Cyclic Quadrilateral
      </button>

        <button class="demoButton" onclick="showDemo('circle_theorem_chord_midpoint_demo.html')">
        Midpoint of a Chord
      </button>

        <button class="demoButton" onclick="showDemo('circle_theorem_tangent_radius_demo.html')">
        Tangent and Radius
      </button>

        <button class="demoButton" onclick="showDemo('circle_theorem_equal_tangents_demo.html')">
        Equal Tangents
      </button>

        <button class="demoButton" onclick="showDemo('circle_theorem_tangent_chord_demo.html')">
        Tangent-Chord Theorem
      </button>

        </div>

        <div class="viewer">
        <iframe
      id="demoFrame"
      src="circle_theorem_same_segment_demo_center_dot_nondiameter.html">
        </iframe>
        </div>

        </div>

        <script>
        function showDemo(fileName) {
          document.getElementById('demoFrame').src = fileName;
        }
      </script>

        </body>
        </html>
        ```

      Place this file in the same folder as all eight demo HTML files.

      Then open `index.html` in a browser, or upload the whole folder to GitHub Pages.
